# /etc/ha-dhcpc/ha-dhcpc.conf — the cluster-shared config: identical on every
# member. The master is authoritative for it: it pushes this document to a node
# when it joins, and `ha-dhcpc ctl update` (master-only) re-reads it from disk,
# applies it and publishes it cluster-wide. A receiver writes the pushed copy to
# its own copy of this path (atomic, digest-verified), so the cluster converges.
designated_master: ""
master_mac: "00:d0:b4:01:0d:a3"
members:
  # priority mirrors each node's local conf priority — every node must compute
  # the same election winner, so the shared list carries the values.
  - { id: meterkast, sync_address: 172.16.11.1, priority: 100 }
  - { id: studeerkamer, sync_address: 172.16.11.2, priority: 200 }
  - { id: woonkamer, sync_address: 172.16.11.3, priority: 300 }

interface: br-lan.300
cluster:
  port: 4227
  heartbeat_ms: 100
  election_deadline_ms: 500
  self_demote_gap_ms: 900
  quorum: majority
  preempt: false
  cluster_timeout_ms: 0
  neighbor_sync: true
  neighbor_sync_resync_s: 0
  neighbor_sync_max: 1024    # max VIP neighbors to sync/store
  addresses:
    br-lan.10: [192.168.10.1/24]
    br-lan.5: [172.16.202.1/24]
    br-lan.3: [172.16.203.1/24]
    br-lan.2: [192.168.2.1/24]
    br-lan.9: [192.168.9.1/24]
    br-lan.8: [192.168.8.1/24]
default_role: slave
dhcp:
  retention: forever
  rediscover_in_retention: true
  rate_limit_ms: 10000
  renew_retry_interval_s: 30
  request_options: [1, 3, 6, 15, 26, 28, 42, 121]
apply:
  routes: true
  backup_gateway: 192.168.10.1
  master_backup_gateway: 172.16.11.4
  gateway_probe: true
  gateway_probe_interval_ms: 1000
  gateway_probe_timeout_ms: 2000
  gateway_probe_fail_threshold: 3
  suppress_member_dad: true
  arp_responder: true
  announce_gratuitous: true
  slave_isolation: nft
  # Optional: keep WAN IP and default route synced on slaves (from master lease). When enabled,
  # slaves apply the same address/default route as master; VIPs remain master-only. Use with
  # slave_wan_local_via_master to steer locally-originated traffic via the master (backup gateway).
  slave_sync_wan: true
  slave_wan_local_via_master: false
  slave_wan_local_table: 200
  # Seamless takeover (see SEAMLESS_TAKEOVER.md): opt-in steering over the non-VIP OSPF
  # fabric during the demoting hold (requires slave_sync_wan and a non-VIP ospf interface).
  # demote_route_via_new_master: false
  # apply.disable_rp_filter defaults to true (rp_filter=0 on managed/all/default paths).
  # demote_nat_bypass_mark: 0x2e05  # mark steered packets; the firewall must return on it
                                    # so the demoting node forwards without NAT rewrite.
  # demote_notrack: true            # NOTRACK steered traffic at prerouting (default on);
                                    # fw4 zones must accept marked traffic — see
                                    # SEAMLESS_FIREWALL_HOWTO.md for the drop-in snippet.
ctl_socket: /tmp/ha-dhcpc.ctl
lease_file: none

routing:
  enabled: true
  advertise:
    public_ip32: always
    vip_subnets: true
    default_route: true
  accept:
    default_route: true

ospf:
  grace_period_s: 120        # hold self LSAs (no rebuild/flush) after startup so
                             # daemon restarts do not move routes
  interfaces:
    - br-lan.11

conntrack_sync:
  enabled: true
  port: 4501
  snapshot_on_connect: true
  resync_interval_s: 60
  timer_sync_interval_s: 60
  max_queue_entries: 8192
  filter:
    non_local_only: true
    include_related: true
    exclude_loopback: true
    families: [ipv4]
  helpers:
    sip: auto
    cache_refresh_s: 30
  apply:
    slave_apply: immediate
    max_entry_age_s: 300
    upsert_fixes: false  # only log upsert fixes (from peers/snapshot diffs), do not apply/report them
loglevel: info

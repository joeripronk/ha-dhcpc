# Shared config (single-node). Identical on every member in a cluster.
# In single-node mode `members` may be omitted/empty and the heartbeat
# transport is disabled; this node runs as master and does not remove its
# routes/IPs on shutdown.
designated_master: ""         # default_role election
master_mac: "00:d0:b4:01:0d:a2"   # internet VLAN MAC = the identity Odido sees today
members: []

interface: internet           # VLAN on enp7s0 (internet@enp7s0)
cluster:
  port: 4227
  heartbeat_ms: 2000
  election_deadline_ms: 6000
  quorum: majority
  cluster_timeout_ms: 0
default_role: master
dhcp:
  retention: forever
  rediscover_in_retention: true
  rate_limit_ms: 10000        # Odido NL fiber: >= 10 s between DHCP packets
  renew_retry_interval_s: 30  # retry interval after a failed RENEW/REBIND
  request_options: [1, 3, 4, 6, 15, 26, 28, 42, 121]  # mirrors old dhclient.conf
apply:
  routes: true
  dns_hook: ""               # resolv.conf stays as-is (local resolver)
  ddclient: /usr/bin/ddclient  # one-shot DDNS update when the public IP changes (master-only)
  suppress_member_dad: true
  arp_responder: true
  announce_gratuitous: true
ctl_socket: /run/ha-dhcpc.ctl
lease_file: none             # dhclient migration done: no dhclient-format lease
                             # DB on this node; state.json is the persistence

routing:
  enabled: true
  advertise:
    public_ip32: always      # always originate the public IP /32 this node holds
    default_route: true      # the default route this node has via the ISP

ospf:
  grace_period_s: 120        # hold self LSAs (no rebuild/flush) after startup so
                             # daemon restarts do not move routes
  router_id: 192.168.10.3    # empty would fall back to the cluster/sync address,
                             # and this single-member cluster has neither
  interfaces:
    - mgt                    # the OSPF VLAN interface (192.168.10.3)

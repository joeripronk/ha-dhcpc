interface: internet           # VLAN on enp7s0 (internet@enp7s0)
cluster:
  port: 4227
  heartbeat_ms: 2000
  election_deadline_ms: 6000
  quorum: majority
  cluster_timeout_ms: 0
default_role: master          # single node: elects itself immediately
dhcp:
  retention: forever
  rediscover_in_retention: true
  rate_limit_ms: 10000        # Odido NL fiber: >= 10 s between DHCP packets
  request_options: [1, 3, 4, 6, 15, 26, 28, 42, 121]  # mirrors old dhclient.conf
apply:
  routes: true
  dns_hook: ""               # resolv.conf stays as-is (chattr +i, local resolver)
  suppress_member_dad: true
  arp_responder: true
  announce_gratuitous: true
ctl_socket: /run/ha-dhcpc.ctl

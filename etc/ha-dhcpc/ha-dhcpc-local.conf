# /etc/ha-dhcpc/ha-dhcpc-local.conf — per-node overlay, wins over
# ha-dhcpc.conf on any key. This node's identity and failover priority (the
# highest-priority live member takes over; ties by node id). interface and
# default_role are the usual things to override per node.
# self: node-b          # optional; defaults to the system hostname
priority: 90
# Slave-only backup default route, installed with a higher metric and removed
# again on promotion. The local OpenWrt routers (meterkast, woonkamer,
# studeerkamer) use the LAN gateway:
apply:
  backup_gateway: 192.168.10.1
